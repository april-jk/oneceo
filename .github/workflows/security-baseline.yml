name: Security Baseline

on:
  pull_request:
  push:
    branches:
      - task-creation-agent
  schedule:
    - cron: "30 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep-api:
    name: SAST Scan (Semgrep apps/api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Run Semgrep against apps/api (advisory on PR/push)
        run: >
          semgrep scan
          --config p/owasp-top-ten
          --config p/typescript
          --config p/secrets
          apps/api/src
        continue-on-error: true
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Detect leaked secrets (advisory on PR/push)
        run: gitleaks git --source . --redact --exit-code 1
        continue-on-error: true

  node-audit-root:
    name: Node Audit (root workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (advisory on PR/push)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  node-audit-web:
    name: Node Audit (apps/web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install app dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (advisory on PR/push)
        working-directory: apps/web
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  node-audit-admin:
    name: Node Audit (apps/admin_management)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        working-directory: apps/admin_management
        run: npm ci

      - name: Audit production dependencies (advisory on PR/push)
        working-directory: apps/admin_management
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  go-audit-sub2api:
    name: Go Audit (billing_model/sub2api/backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        id: setup-go
        if: ${{ hashFiles('billing_model/sub2api/backend/go.mod') != '' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: billing_model/sub2api/backend/go.mod

      - name: Install govulncheck
        if: ${{ steps.setup-go.outcome == 'success' }}
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (advisory on PR/push)
        if: ${{ steps.setup-go.outcome == 'success' }}
        working-directory: billing_model/sub2api/backend
        run: govulncheck ./...
        continue-on-error: true

      - name: Skip govulncheck when target module is missing
        if: ${{ hashFiles('billing_model/sub2api/backend/go.mod') == '' }}
        run: echo "billing_model/sub2api/backend/go.mod not found, skip Go audit for this repository snapshot."

  config-scan:
    name: Config Scan (Trivy misconfig)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan GitHub Actions workflow configuration (advisory on PR/push)
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --quiet .github/workflows
        continue-on-error: true

      - name: Scan deployment and Docker configuration (advisory on PR/push)
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --quiet billing_model/sub2api
        continue-on-error: true
