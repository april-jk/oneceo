name: Security Baseline

on:
  pull_request:
  push:
    branches:
      - task-creation-agent
  schedule:
    - cron: "30 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Install gitleaks
        run: |
          go install github.com/gitleaks/gitleaks/v8@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Detect leaked secrets
        run: gitleaks git --source . --redact --exit-code 1

  node-audit-root:
    name: Node Audit (root workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  node-audit-web:
    name: Node Audit (apps/web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install app dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        working-directory: apps/web
        run: pnpm audit --prod --audit-level high

  node-audit-admin:
    name: Node Audit (apps/admin_management)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        working-directory: apps/admin_management
        run: npm ci

      - name: Audit production dependencies
        working-directory: apps/admin_management
        run: npm audit --omit=dev --audit-level=high

  go-audit-sub2api:
    name: Go Audit (billing_model/sub2api/backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: billing_model/sub2api/backend/go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: billing_model/sub2api/backend
        run: govulncheck ./...

  config-scan:
    name: Config Scan (Trivy misconfig)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan GitHub Actions workflow configuration
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --no-progress .github/workflows

      - name: Scan deployment and Docker configuration
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --no-progress billing_model/sub2api
